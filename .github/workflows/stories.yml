name: Сторис каждый день

# Одна сторис в день из банка content/stories.json (два кадра: вопрос и ответ).
# Выпускается только явно approved комплект. Этот же запуск сохраняет архив
# и отчёт подготовки для будущей карусели; её дата здесь не назначается.
on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'ID сторис из content/stories.json (пусто — следующая в очереди)'
        required: false
      dry_run:
        description: 'Только показать, что было бы опубликовано'
        type: boolean
        default: false
  schedule:
    # Цель — 10:00 МСК: время, когда сторис смотрят по дороге и в перерывах.
    # Ставим на 09:50, потому что очередь Actions на круглом часе самая длинная:
    # прошлые запуски по «0 8» стартовали с опозданием от 11 до 54 минут, а один
    # был пропущен совсем. Некруглая минута и запас в десять минут дают попадание
    # в нужное окно вместо ожидания в общей очереди.
    - cron: '50 6 * * *'

permissions:
  contents: write         # чтобы отметить сторис как опубликованную

# Shared with publish.yml so both jobs persist account state sequentially.
concurrency:
  group: instagram-publishing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Start from current main after the preceding publisher has saved statuses.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Подготовить Stories дня и обновить архив
        id: prepare
        env:
          REQUESTED_STORY_ID: ${{ inputs.story_id }}
        run: |
          args=()
          if [ -n "$REQUESTED_STORY_ID" ]; then args+=(--id "$REQUESTED_STORY_ID"); fi
          node scripts/stories-pipeline.cjs prepare "${args[@]}"

      # Проверяется выбранный комплект, а не неопубликованный хвост ленты.
      - name: Проверка контента
        if: steps.prepare.outputs.story_id != ''
        env:
          SELECTED_STORY_ID: ${{ steps.prepare.outputs.story_id }}
        run: |
          npm install --no-save ffmpeg-static
          node check-content.js "$SELECTED_STORY_ID"

      - name: Опубликовать сторис дня
        if: steps.prepare.outputs.story_id != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SELECTED_STORY_ID: ${{ steps.prepare.outputs.story_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("$SELECTED_STORY_ID")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node publish-stories.js "${args[@]}"

      - name: Сохранить результат в архиве подготовки
        if: always()
        run: node scripts/stories-pipeline.cjs prepare

      - name: Отметить в банке
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git add content/stories.json content/stories-archive content/stories-prepared
          if git diff --cached --quiet; then
            echo "Банк и архив не изменились."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Состояние ежедневных Stories и архив подготовки"
          # Параллельный прогон мог запушить раньше (22.08 сторис и сводка
          # столкнулись — статус публикации потерялся): rebase и повтор.
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            git pull --rebase origin main
          done
          [ "$ok" = "1" ]

      # Видно в логе запуска: когда контент кончается, это заметно заранее
      - name: Остаток банков
        if: always()
        run: node bank-status.js
