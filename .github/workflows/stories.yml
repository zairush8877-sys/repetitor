name: Сторис каждый день

# Одна сторис в день из банка content/stories.json (два кадра: вопрос и ответ).
# Банк одобряется целиком, дальше выходит сам; когда он кончится — запуск
# честно скажет об этом в логе и ничего не опубликует.
on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'ID сторис из content/stories.json (пусто — следующая в очереди)'
        required: false
      dry_run:
        description: 'Только показать, что было бы опубликовано'
        type: boolean
        default: false
  schedule:
    # Цель — 10:00 МСК: время, когда сторис смотрят по дороге и в перерывах.
    # Ставим на 09:50, потому что очередь Actions на круглом часе самая длинная:
    # прошлые запуски по «0 8» стартовали с опозданием от 11 до 54 минут, а один
    # был пропущен совсем. Некруглая минута и запас в десять минут дают попадание
    # в нужное окно вместо ожидания в общей очереди.
    - cron: '50 6 * * *'

permissions:
  contents: write         # чтобы отметить сторис как опубликованную

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Контроль качества перед выпуском (скилл my-skill-instmom).
      - name: Проверка контента
        run: |
          npm install --no-save ffmpeg-static
          node check-content.js

      - name: Опубликовать сторис дня
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node publish-stories.js \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.story_id }}

      - name: Отметить в банке
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if git diff --quiet content/stories.json; then
            echo "Банк не изменился — публиковать было нечего."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/stories.json
          git commit -m "Опубликована сторис дня"
          # Параллельный прогон мог запушить раньше (22.08 сторис и сводка
          # столкнулись — статус публикации потерялся): rebase и повтор.
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main
          done

      # Видно в логе запуска: когда контент кончается, это заметно заранее
      - name: Остаток банков
        if: always()
        run: node bank-status.js
