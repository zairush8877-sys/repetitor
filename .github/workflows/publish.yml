name: Публикация в Instagram

# Запускается вручную (в том числе Claude по вашему «публикуй») или по расписанию
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID поста из content/queue.json (пусто — все со статусом approved)'
        required: false
      dry_run:
        description: 'Только показать, что было бы опубликовано'
        type: boolean
        default: false
  schedule:
    # Ежедневный вечерний выпуск: запуск в 19:30 МСК (16:30 UTC).
    # Стартовое время по просьбе автора от 20.09.2026; оптимум по Insights
    # ещё не подтверждён. Фактический старт зависит от очереди GitHub Actions.
    - cron: '30 16 * * *'

permissions:
  contents: write         # чтобы записать обратно статус published

# One account, one writer across feed publication and standalone Stories.
# Never interrupt a running media_publish: its outcome can become ambiguous.
concurrency:
  group: instagram-publishing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Read the latest persisted queue after waiting for the shared writer slot.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Контроль качества перед выпуском (скилл my-skill-instmom): музыка,
      # композитор, обложка, подпись, фотофоны, лимиты. Красный — не публикуем.
      - name: Проверка контента
        run: |
          npm install --no-save ffmpeg-static
          node check-content.js

      - name: Проверить токен
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node publish.js --check

      # По расписанию — одна публикация в день; вручную можно выпустить всё сразу
      - name: Опубликовать одобренные посты
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node publish.js \
            ${{ github.event_name == 'schedule' && '--one' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.post_id }}

      # always(): если публикация упала на середине списка, уже вышедшие посты
      # всё равно должны получить статус published — иначе следующий запуск
      # выпустит их в ленту второй раз.
      - name: Записать статусы обратно в репозиторий
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if git diff --quiet content/queue.json; then
            echo "Очередь не изменилась — публиковать было нечего."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/queue.json
          git commit -m "Опубликовано в Instagram"
          # Параллельный прогон мог запушить раньше (22.08 сторис и сводка
          # столкнулись — статус публикации потерялся): rebase и повтор.
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            git pull --rebase origin main
          done
          [ "$ok" = "1" ]
