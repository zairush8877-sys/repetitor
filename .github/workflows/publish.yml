name: Публикация в Instagram

# Запускается вручную (в том числе Claude по вашему «публикуй») или по расписанию
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID из активной серии (пусто — один разрешённый слот)'
        required: false
      dry_run:
        description: 'Полная проверка 15 файлов, обложек, аккаунта и истории без публикации'
        type: boolean
        default: false
      upload_probe:
        description: 'Дополнительно проверить приём V3 и обложки: только неопубликованный контейнер, без выпуска в ленту'
        type: boolean
        default: false
  schedule:
    # Daily wakeups; the explicit Moscow calendar allows ONE selected V3 Reel
    # every two days, starting 1 November at 09:00 Moscow. Early/off-day runs are no-ops.
    # Multiple wakeups tolerate delayed/dropped GitHub cron deliveries.
    - cron: '0 6 * * *'
    - cron: '17 4-10 * * *'

permissions:
  contents: write         # чтобы записать обратно статус published

# One account, one writer across feed publication and standalone Stories.
# Never interrupt a running media_publish: its outcome can become ambiguous.
concurrency:
  group: instagram-publishing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Read the latest persisted queue after waiting for the shared writer slot.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Выбрать разрешённый слот серии
        id: slot
        env:
          REQUESTED_POST_ID: ${{ inputs.post_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          UPLOAD_PROBE: ${{ inputs.upload_probe }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const c = require('./campaign-feed');
          const q = require('./content/queue.json');
          const campaign = c.readCampaign('content');
          if (!campaign) throw new Error('Active series calendar is required');
          c.validate(campaign, q.posts);
          const audit = process.env.DRY_RUN === 'true' || process.env.UPLOAD_PROBE === 'true';
          const choice = audit ? { post: null, reason: 'Read-only audit of all fifteen slots' }
            : c.select(campaign, q.posts, new Date(), process.env.REQUESTED_POST_ID || undefined);
          console.log(choice.reason);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${audit || !!choice.post}\naudit=${audit}\npost_id=${choice.post?.id || ''}\n`);
          JS

      - name: Проверка выбранных материалов
        if: steps.slot.outputs.run == 'true'
        env:
          SELECTED_POST_ID: ${{ steps.slot.outputs.post_id }}
          AUDIT: ${{ steps.slot.outputs.audit }}
        run: |
          npm install --no-save ffmpeg-static
          if [ "$AUDIT" = "true" ]; then
            node -e "for (const s of require('./content/active-feed-campaign.json').slots) console.log(s.postId)" > /tmp/campaign-ids
            while IFS= read -r post_id; do node check-content.js "$post_id"; done < /tmp/campaign-ids
          else
            node check-content.js "$SELECTED_POST_ID"
          fi

      - name: Проверить аккаунт Instagram
        if: steps.slot.outputs.run == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node publish.js --check

      - name: Проверить публичные файлы и историю без публикации
        if: steps.slot.outputs.audit == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          UPLOAD_PROBE: ${{ inputs.upload_probe }}
        run: |
          if [ "$UPLOAD_PROBE" = "true" ]; then node publish.js --campaign-upload-probe;
          else node publish.js --campaign-audit; fi

      - name: Выпустить один ролик в разрешённый день
        if: steps.slot.outputs.run == 'true' && steps.slot.outputs.audit != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PERSIST_FEED_INTENT: github
        run: node publish.js --one

      # always(): если публикация упала на середине списка, уже вышедшие посты
      # всё равно должны получить статус published — иначе следующий запуск
      # выпустит их в ленту второй раз.
      - name: Записать статусы обратно в репозиторий
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if git diff --quiet content/queue.json && [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "Очередь не изменилась — публиковать было нечего."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/queue.json
          if ! git diff --cached --quiet; then git commit -m "Состояние выпуска Instagram"; fi
          # Параллельный прогон мог запушить раньше (22.08 сторис и сводка
          # столкнулись — статус публикации потерялся): rebase и повтор.
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            git pull --rebase origin main
          done
          [ "$ok" = "1" ]
