name: Публикация в Instagram

# Запускается вручную (в том числе Claude по вашему «публикуй») или по расписанию
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID поста из content/queue.json (пусто — все со статусом approved)'
        required: false
      dry_run:
        description: 'Только показать, что было бы опубликовано'
        type: boolean
        default: false
  schedule:
    # Очередь GitHub Actions держит задание по 3,5–4,5 часа — прогон приходит
    # сильно позже своего крона. Под эту задержку расписание уже двигали
    # 22.10.2026 (ночные выпуски сгорали за окном 8:00–22:00 МСК), а 26.10
    # запусков стало три: автор разрешила 2–3 публикации в день, «утро, вечер».
    #
    # 26.10.2026 выяснилось худшее: задержка — не единственная беда. В тот день
    # не пришёл НИ ОДИН прогон по расписанию. Утренний (5:09 UTC) не успел
    # зарегистрироваться: три крона попали в main в 9:15 UTC. А дневные —
    # 11:17 и 13:41 UTC — не пришли вовсе, ни через пять часов, ни к ночи.
    # Все три публикации дня пришлось выпускать вручную. GitHub о доставке
    # запусков по расписанию ничего не обещает и при нагрузке их отбрасывает.
    #
    # Поэтому запусков теперь шесть вместо трёх — это не шесть публикаций,
    # а страховка от пропажи. Лишний прогон ничего не делает: publish.js
    # считает публикации дня (PER_DAY = 3) и держит разрыв между ними
    # (MIN_GAP_HOURS = 2), а ночью не публикует вовсе. Чтобы выйти, дню
    # достаточно, чтобы доехала половина прогонов.
    #
    # С поправкой на ту же задержку прогоны приходят примерно с 9:40 до 21:10
    # МСК — весь дневной коридор. Позже 14:00 UTC крон не ставим: прогон
    # пришёл бы после 22:00 МСК, и ночной сторож его отклонит.
    # Минуты нечётные намеренно: на :00 и :30 очередь длиннее.
    - cron: '9 3 * * *'
    - cron: '9 5 * * *'
    - cron: '17 7 * * *'
    - cron: '17 9 * * *'
    - cron: '41 11 * * *'
    - cron: '41 13 * * *'

permissions:
  contents: write         # чтобы записать обратно статус published

# One account, one writer across feed publication and standalone Stories.
# Never interrupt a running media_publish: its outcome can become ambiguous.
concurrency:
  group: instagram-publishing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Read the latest persisted queue after waiting for the shared writer slot.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Контроль качества перед выпуском (скилл my-skill-instmom): музыка,
      # композитор, обложка, подпись, фотофоны, лимиты. Красный — не публикуем.
      - name: Проверка контента
        run: |
          npm install --no-save ffmpeg-static
          node check-content.js

      - name: Проверить токен
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node publish.js --check

      # По расписанию — одна публикация в день; вручную можно выпустить всё сразу
      - name: Опубликовать одобренные посты
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node publish.js \
            ${{ github.event_name == 'schedule' && '--one' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.post_id }}

      # always(): если публикация упала на середине списка, уже вышедшие посты
      # всё равно должны получить статус published — иначе следующий запуск
      # выпустит их в ленту второй раз.
      - name: Записать статусы обратно в репозиторий
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if git diff --quiet content/queue.json; then
            echo "Очередь не изменилась — публиковать было нечего."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/queue.json
          git commit -m "Опубликовано в Instagram"
          # Параллельный прогон мог запушить раньше (22.08 сторис и сводка
          # столкнулись — статус публикации потерялся): rebase и повтор.
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            git pull --rebase origin main
          done
          [ "$ok" = "1" ]
