name: Статистика Instagram

on:
  workflow_dispatch:
    inputs:
      audio:
        description: 'Проверить звук последних роликов вместо статистики'
        type: boolean
        default: false

jobs:
  recent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Последние публикации
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node publish.js ${{ inputs.audio == true && '--audio-check' || '--recent' }}
