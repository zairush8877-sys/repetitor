name: Статистика Instagram

on:
  workflow_dispatch:
    inputs:
      audio:
        description: 'Проверить звук последних роликов вместо статистики'
        type: boolean
        default: false
      limit:
        description: 'Сколько публикаций разбирать (по умолчанию 8, максимум 50)'
        required: false
        default: '30'

jobs:
  recent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg для проверки звука
        if: ${{ inputs.audio == true }}
        run: npm install --no-save ffmpeg-static
      - name: Последние публикации
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node publish.js ${{ inputs.audio == true && '--audio-check' || format('--recent={0}', inputs.limit || '30') }}
